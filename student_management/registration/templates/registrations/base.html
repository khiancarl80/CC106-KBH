{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Student Management{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'registration/style.css' %}">
</head>
<body>
    <header class="site-header">
        <nav class="site-nav">
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'student_registration' %}">Registration</a>
            <a href="{% url 'student_list' %}">Student Directory</a>
        </nav>
    </header>
    <main class="page">
        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <p class="message {{ message.tags }}">{{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
